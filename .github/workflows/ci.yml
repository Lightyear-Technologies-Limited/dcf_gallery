name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Asset audit (every piece resolves to a servable image)
        run: npm run audit
      # Static cross-reference of every slug-keyed file against data.ts. ~0.2s,
      # no network — placed before the build so a broken reference fails fast.
      - name: Slug audit (every slug-keyed reference resolves)
        run: npm run audit:slugs
      - name: Validate editorial content (Zod)
        run: npm run content
      - name: Build (static generation of all pages)
        run: npm run build
      # Both specs: smoke.spec.ts (journeys) + invariants.spec.ts (properties that
      # break silently — OG cards, cacheability, real 404s, sitemap, oversampling,
      # heading structure).
      - name: E2E (Playwright — smoke + invariants)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Lighthouse budget (informational)
        run: npx @lhci/cli autorun
        continue-on-error: true
